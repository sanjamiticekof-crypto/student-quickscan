<!DOCTYPE html>
<html lang="sr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test kamere</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      font-size: 18px;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }

  </style>

</head>


<body>

  <h1>Test kamere</h1>

  <button onclick="startCamera()">
    POKRENI KAMERU
  </button>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <div id="status">
    Kamera nije pokrenuta.
  </div>


<script>

<script>

async function startCamera() {

  const status =
    document.getElementById('status');

  const video =
    document.getElementById('video');


  status.innerText =
    'POKUŠAVAM DA POKRENEM KAMERU...';


  try {

    if (
      !navigator.mediaDevices
    ) {

      throw new Error(
        'navigator.mediaDevices NIJE DOSTUPAN'
      );

    }


    if (
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'getUserMedia NIJE DOSTUPAN'
      );

    }


    status.innerText =
      'getUserMedia je dostupan. Tražim dozvolu...';


    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    status.innerText =
      'STREAM JE DOBIJEN. POKUŠAVAM VIDEO...';


    video.srcObject =
      stream;


    try {

      await video.play();

    } catch (playError) {

      status.innerText =
        'VIDEO PLAY GREŠKA: ' +
        playError.name +
        ' — ' +
        playError.message;

      return;

    }


    status.innerText =
      'KAMERA RADI!';


  } catch (error) {

    status.innerText =

      'GREŠKA KAMERE:' +

      '\n\n' +

      'Naziv: ' +

      error.name +

      '\n\n' +

      'Poruka: ' +

      error.message;


    console.error(
      'CAMERA ERROR',
      error
    );

  }

}

</script>


</script>


</body>

</html>
