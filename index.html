<!DOCTYPE html>
<html lang="sr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test kamere</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 12px;
      background: black;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      font-size: 18px;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }

  </style>

</head>


<body>

  <h1>Test kamere</h1>

  <button onclick="startCamera()">
    POKRENI KAMERU
  </button>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <div id="status">
    Kamera nije pokrenuta.
  </div>


<script>

async function startCamera() {

  const status =
    document.getElementById('status');

  const video =
    document.getElementById('video');

  status.innerText =
    'Tražim kameru...';


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: true,

        audio: false

      });


    video.srcObject =
      stream;


    status.innerText =
      'KAMERA RADI!';


    console.log(
      'Camera stream:',
      stream
    );


  } catch (error) {

    console.error(
      error
    );


    status.innerText =
      'GREŠKA: ' +
      error.name +
      ' — ' +
      error.message;

  }

}

</script>


</body>

</html>
