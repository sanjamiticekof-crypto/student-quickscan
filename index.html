<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test kamere</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 500px;
      background: black;
      margin-top: 20px;
    }

    button {
      width: 100%;
      max-width: 500px;
      padding: 16px;
      font-size: 18px;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>Test kamere</h1>

  <button id="start">
    POKRENI KAMERU
  </button>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <div id="status">
    Kamera nije pokrenuta.
  </div>

<script>

const button =
  document.getElementById('start');

const video =
  document.getElementById('video');

const status =
  document.getElementById('status');


button.addEventListener(
  'click',
  async function () {

    status.textContent =
      'Pokušavam da pokrenem kameru...';

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      video.srcObject =
        stream;

      await video.play();

      status.textContent =
        'KAMERA RADI!';

    } catch (error) {

      status.textContent =
        'GREŠKA:\n' +
        error.name +
        '\n' +
        error.message;

    }

  }
);

</script>

</body>
</html>
